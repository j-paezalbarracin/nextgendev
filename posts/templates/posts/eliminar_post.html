{% extends 'posts/base.html' %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card-modern border border-danger">
            <div class="card-body text-center p-5">
                <i class="fas fa-exclamation-triangle text-danger fa-4x mb-4"></i>
                <h3 class="fw-bold">¿Eliminar "{{ post.titulo }}"?</h3>
                <p class="text-muted">Esta acción es irreversible. ¿Estás seguro?</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-3 justify-content-center">
                        <button type="submit" class="btn btn-danger btn-modern">
                            <i class="fas fa-trash"></i> Sí, eliminar
                        </button>
                        <a href="{% url 'detalle_post' post.pk %}" class="btn btn-secondary btn-modern">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
